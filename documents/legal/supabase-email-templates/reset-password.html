<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Reset your Caydex password</title>
</head>
<body style="margin:0;padding:0;">
<div style="max-width:480px;margin:0 auto;padding:24px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;">
<h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;font-weight:700;">Reset your Caydex password</h1>
<p style="margin:0 0 12px;">Use this code to reset your password:</p>
<p style="margin:0 0 12px;"><span style="display:inline-block;padding:8px 14px;border:1px solid #9aa0a6;border-radius:8px;font-family:Menlo,Consolas,'Courier New',monospace;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:4px;">{{ .Token }}</span></p>
<p style="margin:0 0 24px;">Enter it in the app along with your new password. The code expires shortly.</p>
<p style="margin:0;font-size:14px;">If you didn't request this, you can ignore this email — your password won't change.</p>
</div>
</body>
</html>
