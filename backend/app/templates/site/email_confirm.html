<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}} · Caydex</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#171B26" />
  <link rel="icon" href="data:," />
  <!--
    Static, code-authored page for the Confirm-signup email's link (app/api/email_confirm_page.py).
    No script, no external resource, no market data, no model text. Every slot below is filled
    with code-owned copy, escaped; the link's token is the only request value ever drawn, and
    only inside the hidden form field, after it matched a hex-only pattern.
  -->
  <style>
    :root {
      --page: #171B26;
      --card: #1E2330;
      --edge: #2A3142;
      --accent: #60A5FA;
      --ink-on-accent: #171B26;
      --text: #FFFFFF;
      --text-2: #C3C9D6;
      --text-3: #9AA3B5;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
    header.top { padding: 20px 0; }
    .brand { font-weight: 700; font-size: 1.15rem; letter-spacing: .01em; color: var(--text); }
    .brand .dot { color: var(--accent); }
    .card {
      background: var(--card);
      border: 1px solid var(--edge);
      border-radius: 16px;
      padding: 24px 20px;
      margin: 24px 0 40px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 5vw, 2rem);
      line-height: 1.2;
      letter-spacing: -.01em;
    }
    p { margin: 0 0 16px; color: var(--text-2); overflow-wrap: anywhere; }
    p:last-child { margin-bottom: 0; }
    form { margin: 8px 0 0; }
    button {
      display: inline-block;
      width: 100%;
      margin: 0;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--ink-on-accent);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover, button:focus-visible { filter: brightness(1.08); }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    .note { font-size: .9rem; color: var(--text-3); margin-top: 16px; }
    footer {
      border-top: 1px solid var(--edge);
      padding: 24px 0 40px;
      color: var(--text-3);
      font-size: .9rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover, footer a:focus-visible { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <span class="brand">Caydex<span class="dot">.</span></span>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="card" aria-labelledby="confirm-heading">
        <h1 id="confirm-heading">{{HEADING}}</h1>
        {{BODY}}
        {{FORM}}
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <a href="/support">Support</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a>
    </div>
  </footer>
</body>
</html>
