[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# Redeploy only when the backend changes (owner, 2026-11-20: "Backend only"). The image is built
# from /backend alone, so nothing outside it can change what runs, and every redeploy restarts the
# process: it forgets which earnings pushes went out (their inbox text can no longer be corrected)
# and can drop a push due in a release window. Patterns are gitignore-style from the REPO root
# even with a Root Directory set (marketing/railway.toml), hence /backend/. Set the same Watch
# Paths in the dashboard before Railway stops reading this file (OWNER_TASKS).
watchPatterns = ["/backend/**"]

[deploy]
# /health/pdf 503s when WeasyPrint can't load -> a broken native stack FAILS the deploy
# instead of silently shipping. Railway runs this once before promoting the new deployment.
# It ALSO waits for the Home first-paint warm (app/main.py `_run_home_boot_warm`): until that
# finishes, or HOME_BOOT_WARM_MAX_WAIT_SECONDS (45 s) pass, it answers 503 "warming" and
# Railway keeps serving the old deployment, so the first Home request after a deploy is warm.
# The deadline is enforced in the route; 3 x that wait must stay within healthcheckTimeout
# (pinned by backend/tests/test_deploy_command_parity.py).
healthcheckPath = "/health/pdf"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
